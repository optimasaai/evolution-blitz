name: Build and Push Evolution API

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to JustRunMy registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.JRM_REGISTRY }}
          username: ${{ secrets.JRM_USERNAME }}
          password: ${{ secrets.JRM_PASSWORD }}

      - name: Build and push Evolution API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: jdr-r45mq87yg.justrunmy.app/r45mq87yg:v1
